name: Обновить инструмент

on:
  workflow_dispatch:          # кнопка «Обновить» на странице настроек

permissions:
  contents: write

jobs:
  obnovit:
    if: github.repository != 'nikitabuilding-code/dashboard-ozon'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Взять свежий код из шаблона
        run: bash sbor/obnovit.sh
