# Cloudflare Workers: страница за паролем. Пароль и доступ к GitHub задаются в настройках Worker
# (Settings → Variables and Secrets), здесь их нет.
name = "dashboard-ozon"
main = "worker/index.js"
compatibility_date = "2025-06-01"
keep_vars = true
workers_dev = true
preview_urls = false

[assets]
directory = "./sayt"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"
